# Production-style stack: run with `docker compose up -d --build`.
# Settings come from .env (see .env.example).
#
# For local development against a throwaway database, also start the `db`
# profile and point DB_HOST at it:
#   DB_HOST=db DB_SSLMODE=disable DB_PASSWORD=postgres docker compose --profile local-db up --build

x-app: &app
  build: .
  image: shipping-module:latest
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  migrate:
    <<: *app
    command: ["python", "main.py", "migrate"]
    restart: "no"
    healthcheck:
      disable: true

  worker:
    <<: *app
    command: ["python", "main.py", "worker"]
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers"]
    ports:
      # Bound to localhost: expose through a reverse proxy or a private network, not directly.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-marinetraffic}
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
