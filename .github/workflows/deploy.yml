# Deploys to the EC2 host over SSH, the same way chem-os does. One-time server
# prep: `sudo bash scripts/ec2-setup.sh`. Required repository secrets:
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
#   SHIPPING_DB_HOST, SHIPPING_DB_NAME, SHIPPING_DB_USER, SHIPPING_DB_PASSWORD
# Optional: SHIPPING_SCRAPER_PROXY

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shipping-module
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Build release and settings
        env:
          DB_HOST: ${{ secrets.SHIPPING_DB_HOST }}
          DB_NAME: ${{ secrets.SHIPPING_DB_NAME }}
          DB_USER: ${{ secrets.SHIPPING_DB_USER }}
          DB_PASSWORD: ${{ secrets.SHIPPING_DB_PASSWORD }}
          SCRAPER_PROXY: ${{ secrets.SHIPPING_SCRAPER_PROXY }}
        run: |
          git archive --format=tar.gz -o /tmp/shipping-release.tar.gz HEAD
          umask 077
          {
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=5432\n'
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_SSLMODE=require\n'
            printf 'SCRAPER_PROXY=%s\n' "$SCRAPER_PROXY"
          } > /tmp/shipping.env

      - name: Upload
        run: |
          scp -i ~/.ssh/deploy_key /tmp/shipping-release.tar.gz /tmp/shipping.env scripts/deploy.sh "$TARGET:/tmp/"
          ssh -i ~/.ssh/deploy_key "$TARGET" "chmod 600 /tmp/shipping.env"

      - name: Install release
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "sudo bash /tmp/deploy.sh /tmp/shipping-release.tar.gz /tmp/shipping.env; rc=\$?; rm -f /tmp/deploy.sh /tmp/shipping-release.tar.gz /tmp/shipping.env; exit \$rc"

      - name: Clean up local secrets
        if: always()
        run: rm -f /tmp/shipping.env ~/.ssh/deploy_key
